<mat-form-field class="full-width" [appearance]="appearance">
    <mat-label>{{ addressLabelText }}</mat-label>
    <input
        matInput
        [(ngModel)]="address"
        (change)="onQuery($event)"
        placeholder="{{ placeholderText }}"
        class="form-control"
        #search
        MatValidateAddress
        required
    />

    @if (addressSearchControl.hasError('required')) {
        <mat-error>
            {{ requiredErrorText }}
        </mat-error>
    }

    @if (addressSearchControl.hasError('validateAddress')) {
        <mat-error>
            {{ invalidErrorText }}
        </mat-error>
    }
</mat-form-field>
